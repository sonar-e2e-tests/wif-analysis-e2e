run-name: wif-${{ inputs.correlation_id }}
env:
  SONAR_SCANNER_JSON_PARAMS: '{"sonar.buildString":"${{ github.run_id }}-${{ github.run_attempt }}"}'
name: Build
on:
  workflow_dispatch:
    inputs:
      correlation_id:
        required: true
        type: string
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - uses: SonarSource/sonarqube-auth-action@v1
        id: auth
        with:
          oidc-audience: https://dev.sonarcloud.io
          sonar-api-base-url: https://api.sc-dev13.io
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
